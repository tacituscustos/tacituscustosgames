# Jekyll config for GitHub Pages.
#
# The only reason this file exists is the exclude list. These are working
# material or server code rather than part of the site, and excluding them here means they are
# not served from tacituscustosgames.com at all — robots.txt asks crawlers to
# skip them, which is a request; this removes them, which is not.
#
# It does not make them private. The repository is public and anything
# committed to it is readable on GitHub.
#
# `lab` is prototypes, and it is deliberately NOT on this list. It was, for
# about an hour, on the reasoning that a served prototype can be found and
# played before anyone decided it was ready. That reasoning lost to a better
# one: a prototype nobody outside can reach cannot be tested by the person who
# asked for it. The page carries its own warning instead of relying on being
# unreachable — which is this site's usual trade, a stated limit over a hidden
# one.
#
# What excluding it never solved, and no page setting can: a page cannot hide
# anything from a model that is reading it, whoever else is or is not allowed
# in. The spectator narration is safe because of what it can see, not because
# of who can open the door. See lab/spectator.html.
#
# Setting `exclude` replaces Jekyll's default exclude list rather than adding to
# it. That is harmless here: the defaults name Gemfile, node_modules/ and vendor
# paths, none of which this repository has, and none of which it will have while
# the no-build-step constraint holds.

exclude:
  - docs
  - CLAUDE.md
  - worker
